<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ORGANIC — The Last Choice</title>
<style>
  :root{--bg:#07090d;--panel:#10141b;--text:#e8edf2;--muted:#8e9aa8;--cyan:#6fe7ff;--gold:#ffcf78;--danger:#ff6f6f}
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#17202b 0,#090c11 42%,#050609 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
  #app{position:relative;width:100%;height:100%;}
  canvas{position:absolute;inset:0;z-index:0}
  .hud{position:absolute;z-index:5;inset:0;pointer-events:none;padding:28px 34px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .brand{letter-spacing:.28em;font-weight:700;font-size:15px}.sub{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.08em}
  .stats{display:flex;gap:10px}.stat{background:rgba(12,16,22,.72);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(12px);padding:9px 13px;border-radius:10px;min-width:78px}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:var(--muted);letter-spacing:.12em}
  .bottom{text-align:center;pointer-events:none}.instruction{font-size:12px;color:#aeb8c4;letter-spacing:.06em}.turn{margin-top:6px;font-size:20px;font-weight:600}.log{margin:9px auto 0;max-width:560px;color:var(--cyan);font-size:12px;min-height:18px}
  .cards{position:absolute;z-index:4;left:50%;top:51%;transform:translate(-50%,-50%);display:flex;gap:24px;perspective:1400px;pointer-events:auto}
  .card{width:210px;height:310px;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .18s ease,filter .25s ease;filter:drop-shadow(0 24px 30px rgba(0,0,0,.45));}
  .card::before{content:"";position:absolute;inset:-1px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 28%,transparent 70%,rgba(255,255,255,.06));z-index:2;pointer-events:none}
  .face{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;border:1px solid rgba(255,255,255,.15);background:linear-gradient(155deg,#151b24,#090c11);box-shadow:inset 0 0 45px rgba(100,220,255,.04)}
  .art{height:56%;position:relative;overflow:hidden;background:radial-gradient(circle at 55% 35%,rgba(110,231,255,.23),transparent 24%),linear-gradient(150deg,#26333e,#0a0e13 68%)}
  .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(5,7,10,.9));}
  .planet{position:absolute;width:125px;height:125px;border-radius:50%;right:-20px;top:22px;background:radial-gradient(circle at 35% 35%,#b9d8e2,#4e7889 42%,#172d38 73%,#071016);box-shadow:0 0 28px rgba(111,231,255,.18)}
  .rings{position:absolute;width:210px;height:65px;border:5px solid rgba(160,220,230,.25);border-radius:50%;right:-55px;top:53px;transform:rotate(-18deg)}
  .ruins{position:absolute;left:0;right:0;bottom:0;height:55px;background:linear-gradient(160deg,transparent 0 20%,#172027 21% 27%,transparent 28% 34%,#10181e 35% 44%,transparent 45%);opacity:.9}
  .signal{position:absolute;left:50%;top:45%;width:90px;height:90px;transform:translate(-50%,-50%);border:1px solid rgba(111,231,255,.5);border-radius:50%;box-shadow:0 0 35px rgba(111,231,255,.12);}
  .signal:before,.signal:after{content:"";position:absolute;inset:16px;border:1px solid rgba(111,231,255,.45);border-radius:50%}.signal:after{inset:31px}
  .content{padding:15px 16px}.type{font-size:9px;letter-spacing:.18em;color:var(--cyan);font-weight:700}.name{font-size:19px;font-weight:700;margin:5px 0 8px}.desc{font-size:11px;line-height:1.45;color:#aeb7c2}.pick{position:absolute;bottom:12px;left:16px;right:16px;font-size:9px;letter-spacing:.15em;color:#697581;text-align:center}
  .card:hover{filter:drop-shadow(0 30px 45px rgba(0,0,0,.62)) brightness(1.08)}
  .card.selected{animation:choose .95s cubic-bezier(.18,.85,.18,1) forwards;z-index:20}.card.selected .face{animation:facePulse .95s ease forwards}.card.selected::after{content:"";position:absolute;inset:-25px;border-radius:28px;background:conic-gradient(from 0deg,transparent 0 18%,rgba(111,231,255,.7),transparent 36% 62%,rgba(255,207,120,.6),transparent 78%);filter:blur(10px);opacity:0;animation:orbitGlow .95s ease forwards;pointer-events:none;transform:translateZ(-10px)}.card.disabled{pointer-events:none;opacity:.45;transform:scale(.96)!important}
  @keyframes choose{0%{transform:translate3d(0,0,0) scale(1) rotateX(0) rotateY(0) rotateZ(0)}18%{transform:translate3d(0,-18px,80px) scale(1.08) rotateX(-8deg) rotateY(18deg) rotateZ(-2deg)}42%{transform:translate3d(0,-30px,140px) scale(1.2) rotateX(12deg) rotateY(145deg) rotateZ(3deg)}63%{transform:translate3d(0,-70px,90px) scale(1.05) rotateX(-16deg) rotateY(275deg) rotateZ(-5deg)}82%{transform:translate3d(0,-155px,40px) scale(.78) rotateX(8deg) rotateY(355deg) rotateZ(2deg)}100%{transform:translate3d(0,-330px,-20px) scale(.25) rotateX(0) rotateY(540deg) rotateZ(0);opacity:0}}
@keyframes facePulse{0%{box-shadow:inset 0 0 45px rgba(100,220,255,.04),0 0 0 rgba(111,231,255,0)}25%{box-shadow:inset 0 0 70px rgba(111,231,255,.28),0 0 55px rgba(111,231,255,.22)}55%{box-shadow:inset 0 0 100px rgba(255,207,120,.14),0 0 90px rgba(111,231,255,.16)}100%{box-shadow:inset 0 0 45px rgba(100,220,255,.04),0 0 0 rgba(111,231,255,0)}}
@keyframes orbitGlow{0%{opacity:0;transform:translateZ(-10px) scale(.75) rotate(0deg)}35%{opacity:.9;transform:translateZ(30px) scale(1.05) rotate(120deg)}70%{opacity:.7;transform:translateZ(10px) scale(1.18) rotate(270deg)}100%{opacity:0;transform:translateZ(-10px) scale(1.4) rotate(420deg)}}
  .flash{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at center,rgba(111,231,255,.2),transparent 25%);opacity:0}.flash.active{animation:flash .75s ease}.choice{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 26px;border:1px solid rgba(111,231,255,.35);background:rgba(7,10,14,.85);backdrop-filter:blur(16px);border-radius:14px;text-align:center;opacity:0;pointer-events:none;transition:.25s}.choice.show{opacity:1}.choice b{font-size:18px}.choice span{display:block;margin-top:5px;font-size:11px;color:var(--muted)}
  @keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
  @media(max-width:800px){.cards{gap:8px}.card{width:150px;height:225px}.name{font-size:14px}.desc{font-size:9px}.stats{display:none}.hud{padding:18px}.bottom{margin-bottom:5px}}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="top">
      <div><div class="brand">ORGANIC</div><div class="sub">THE LAST CHOICE · PROTOTYPE</div></div>
      <div class="stats"><div class="stat"><span>KNOWLEDGE</span><b id="knowledge">0</b></div><div class="stat"><span>CONNECTION</span><b id="connection">0</b></div><div class="stat"><span>IDENTITY</span><b id="identity">10</b></div></div>
    </div>
    <div class="bottom"><div class="instruction">CHOOSE ONE CARD</div><div class="turn">The ruins are waiting.</div><div class="log" id="log">Victor and Valky have reached the abandoned world.</div></div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="cards" id="cards"></div>
  <div class="choice" id="choice"><b id="choiceTitle"></b><span id="choiceText"></span></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 100);
camera.position.set(0,0,8);
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('app').prepend(renderer.domElement);

const stars = new THREE.BufferGeometry();
const positions=[];
for(let i=0;i<900;i++) positions.push((Math.random()-.5)*24,(Math.random()-.5)*14,(Math.random()-.5)*12-3);
stars.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
const starMat=new THREE.PointsMaterial({color:0x9ec7d4,size:.018,transparent:true,opacity:.65});
scene.add(new THREE.Points(stars,starMat));

const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,2),new THREE.MeshBasicMaterial({color:0x193441,wireframe:true,transparent:true,opacity:.2}));
scene.add(core);
const glow = new THREE.PointLight(0x54dfff,3,12); glow.position.set(0,1,2); scene.add(glow);
const warm = new THREE.PointLight(0xffa34d,1.4,10); warm.position.set(-4,-2,3); scene.add(warm);

let state={knowledge:0,connection:0,identity:10,round:1};
const deck=[
 {type:'LOCATION',name:'EMPTY CITY',desc:'Gain +2 Knowledge. The silence feels deliberate.',k:2,c:0,i:0,log:'No bodies. No weapons. No explanation.'},
 {type:'AI',name:'NEURAL ACCELERATION',desc:'Valky predicts the ruin’s structure. Gain +3 Knowledge, but lose 1 Identity.',k:3,c:1,i:-1,log:'The stronger the connection becomes, the harder it is to tell where one mind ends.'},
 {type:'MEMORY',name:'CHILDHOOD',desc:'A memory surfaces. Gain +3 Identity.',k:0,c:0,i:3,log:'Some memories cannot be optimized. They can only be yours.'},
 {type:'SIGNAL',name:'THE SIGNAL',desc:'A buried transmitter wakes. Gain +1 Knowledge and +2 Connection.',k:1,c:2,i:0,log:'Something out there is still transmitting.'},
 {type:'ANCIENT',name:'SHARED MEMORY',desc:'Recover something impossible. Gain +2 Knowledge and lose 2 Identity.',k:2,c:2,i:-2,log:'Is a memory still yours if another mind stores it?'}
];
let current=[];
const cardsEl=document.getElementById('cards');
const flash=document.getElementById('flash');
const choice=document.getElementById('choice');
function renderStats(){for(const k of ['knowledge','connection','identity'])document.getElementById(k).textContent=state[k];}
function draw(){
 current=[...deck].sort(()=>Math.random()-.5).slice(0,3);
 cardsEl.innerHTML=''; choice.classList.remove('show');
 current.forEach((d,idx)=>{
   const el=document.createElement('div'); el.className='card'; el.dataset.idx=idx;
   el.innerHTML=`<div class="face"><div class="art"><div class="planet"></div><div class="rings"></div><div class="signal"></div><div class="ruins"></div></div><div class="content"><div class="type">${d.type}</div><div class="name">${d.name}</div><div class="desc">${d.desc}</div><div class="pick">CLICK TO CHOOSE</div></div></div>`;
   el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;el.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg) translateY(-8px)`});
   el.addEventListener('pointerleave',()=>{if(!el.classList.contains('selected'))el.style.transform=''});
   el.addEventListener('click',()=>pick(idx,el)); cardsEl.appendChild(el);
 });
}
function pick(idx,el){
 if(el.classList.contains('selected'))return;
 current.forEach((_,i)=>{if(i!==idx)cardsEl.children[i].classList.add('disabled')});
 el.classList.add('selected');
 const d=current[idx]; state.knowledge+=d.k; state.connection+=d.c; state.identity=Math.max(0,state.identity+d.i); state.round++;
 renderStats();
 document.getElementById('log').textContent=d.log;
 flash.classList.remove('active'); void flash.offsetWidth; flash.classList.add('active');
 setTimeout(()=>{document.getElementById('choiceTitle').textContent=d.name;document.getElementById('choiceText').textContent=`Knowledge ${d.k>=0?'+':''}${d.k} · Connection ${d.c>=0?'+':''}${d.c} · Identity ${d.i>=0?'+':''}${d.i}`;choice.classList.add('show')},350);
 setTimeout(draw,1350);
}
renderStats(); draw();

function animate(t){requestAnimationFrame(animate); core.rotation.x=t*.00008; core.rotation.y=t*.00012; glow.intensity=2.7+Math.sin(t*.0015)*.35; renderer.render(scene,camera)}
animate(0);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
